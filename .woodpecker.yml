# Woodpecker CI, mirroring .github/workflows/ci.yml.
when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: pull_request

steps:
  lint:
    image: homelab/ci-python:3.15
    commands:
      - uv run --frozen ruff check .
      - uv run --frozen ruff format --check .

  test:
    image: homelab/ci-python:3.15
    commands:
      - apt-get update
      - >-
        apt-get install -y --no-install-recommends
        texlive-latex-base texlive-latex-recommended texlive-latex-extra
        texlive-lang-german texlive-lang-english texlive-fonts-recommended
        texlive-publishers cm-super
      - uv sync --frozen
      - uv run --frozen pytest --tb=short


  # Container image: validated on PRs, pushed to Harbor from main.
  image-check:
    image: woodpeckerci/plugin-kaniko:2.3.3
    settings:
      dry-run: true
      registry: harbor.hieronymi-ludwig.de
      repo: homelab/letter-generator
      dockerfile: Dockerfile
      context: .
    when:
      - event: pull_request
        # Docs-only changes do not need an image build.
        path:
          exclude: ["**/*.md", "*.md", "LICENSE*", "docs/**"]

  image:
    image: woodpeckerci/plugin-kaniko:2.3.3
    settings:
      registry: harbor.hieronymi-ludwig.de
      repo: homelab/letter-generator
      dockerfile: Dockerfile
      context: .
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      username:
        from_secret: harbor_username
      password:
        from_secret: harbor_password
      cache: true
      cache-repo: homelab/letter-generator-cache
    when:
      - event: [push, manual]
        branch: ${CI_REPO_DEFAULT_BRANCH}
        # Docs-only changes do not need an image build.
        path:
          exclude: ["**/*.md", "*.md", "LICENSE*", "docs/**"]
