[project]
name = "brief"
version = "0.1.0"
description = "Generates standard letters (g-brief LaTeX) from a web form -- preview + PDF download."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "sqlmodel>=0.0.22",
]

# uv-native dev dependency group (PEP 735), following a common
# convention: `uv sync` installs this by default (local dev gets tests +
# linters for free); `uv sync --no-dev` -- for production installs --
# skips it, so production never carries pytest/ruff.
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

# Deployed application (uvicorn runs app.main:app in place), not a
# distributed library -- nothing ever imports `import brief`.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length, not enforced (see line-length above only guiding, not hard).
# B008: FastAPI's required Depends()-in-default-argument pattern, not a real bug
# (same rationale as cv-service's pyproject.toml).
ignore = ["E501", "B008"]
